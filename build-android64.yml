name: Build Ultimate GD Toolbox (Android64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release
          use-lto: true

      - name: Upload compiled Geode package
        uses: actions/upload-artifact@v4
        with:
          name: UltimateGDToolbox-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
